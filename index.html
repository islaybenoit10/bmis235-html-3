    <style>
    /* CSS: Styles only the interactive map */

    .showcase {
        width: 100%;
        max-width: 850px;
        margin: 25px auto;
        font-family: Georgia, serif;
    }

    .showcase-map {
        position: relative;
        width: 100%;
        overflow: hidden;
        border-radius: 18px;
        background: #dcebf0;
    }

    .showcase-map svg {
        display: block;
        width: 100%;
        height: auto;
    }

    .showcase-land {
        fill: #b7cbb1;
        stroke: #91ad91;
        stroke-width: 1.4;
        stroke-linejoin: round;
    }

    .showcase-pin {
        position: absolute;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 3px solid white;
        border-radius: 50% 50% 50% 0;
        background: #2b5d8c;
        color: white;
        font-size: 12px;
        cursor: pointer;
        transform: translate(-50%, -100%) rotate(-45deg);
        box-shadow: 0 2px 6px #5555;
    }

    .showcase-pin:hover {
        background: #d49b42;
    }

    .showcase-pin:focus-visible {
        outline: 3px solid #d49b42;
        outline-offset: 4px;
    }

    /* Pin positions use the map's longitude and latitude */
    .showcase-scotland {
        left: 48.8%;
        top: 20.3%;
    }

    .showcase-italy {
        left: 53.5%;
        top: 29.7%;
    }

    .showcase-puerto-rico {
        left: 31.5%;
        top: 46.8%;
    }

    .showcase-result {
        box-sizing: border-box;
        width: 100%;
        min-height: 52px;
        margin-top: 12px;
        padding: 14px;
        border-radius: 12px;
        background: #f4efe6;
        color: #2b5d8c;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
    }
    </style>

    <script>
    // JavaScript: Displays the destination when a pin is clicked

    document.querySelectorAll(".showcase .showcase-pin")
        .forEach(function(pin) {

            pin.addEventListener("click", function() {

                document.querySelector(".showcase-result").textContent =
                    "✈ " + pin.dataset.place;

            });

        });
    </script>
