      class="showcase-pin showcase-pr"

      ●

  <!-- Destination name appears here -->
  <div class="showcase-result" aria-live="polite">
    Click a pin to explore a destination!
  </div>

  <style>
  /* CSS: Styles for the interactive map only */

  .showcase {
    width: 100%;
    max-width: 850px;
    margin: 25px auto;
    font-family: Georgia, serif;
  }

  .showcase-map {
    position: relative;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
  }

  .showcase-map svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .showcase-pin {
    position: absolute;
    width: 32px;
    height: 32px;
    border: 3px solid white;
    border-radius: 50% 50% 50% 0;
    background: #2b5d8c;
    color: white;
    font-size: 12px;
    cursor: pointer;
    transform: translate(-50%, -100%) rotate(-45deg);
    box-shadow: 0 2px 6px #5555;
  }

  .showcase-pin:hover {
    background: #d49b42;
    transform: translate(-50%, -100%) rotate(-45deg) scale(1.15);
  }

  .showcase-scotland {
    left: 48%;
    top: 34%;
  }

  .showcase-italy {
    left: 51%;
    top: 43%;
  }

  .showcase-pr {
    left: 32%;
    top: 55%;
  }

  .showcase-result {
    margin-top: 12px;
    padding: 15px;
    border-radius: 12px;
    background: #f4efe6;
    color: #2b5d8c;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    min-height: 24px;
  }
  </style>

  <script>
  // JavaScript: Shows the destination name when a pin is clicked

  document.querySelectorAll(".showcase .showcase-pin")
    .forEach(function(pin) {

      pin.addEventListener("click", function() {

        document.querySelector(".showcase-result").textContent =
          "✈ " + pin.dataset.place;

      });

    });
  </script>
